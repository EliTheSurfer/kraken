[package]
name = "kraken"
version = "0.2.0"
edition = "2024"
description = "A GitKraken-style git graph in the terminal: pixel-drawn lanes and avatars, fuzzy finding, checkout, reset and rebase"
license = "MIT"
repository = "https://github.com/EliTheSurfer/kraken"
readme = "README.md"
keywords = ["git", "tui", "graph", "terminal", "gitkraken"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
image = "0.25.10"
md-5 = "0.11.0"
nucleo-matcher = "0.3.1"
ratatui = "0.30"
ratatui-image = { version = "11", default-features = false, features = ["crossterm", "image-defaults"] }
serde_json = "1.0.152"
sha2 = "0.11.0"
svgtypes = "0.16.1"
tiny-skia = "0.12.0"
ureq = "3.4.2"

[dev-dependencies]
tempfile = "3.27.0"
